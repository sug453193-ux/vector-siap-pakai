name: Generate lightweight image previews

on:
  push:
    branches: [main]
    paths:
      - "assets/**/*.png"
      - "assets/**/*.jpg"
      - "assets/**/*.jpeg"
      - ".github/workflows/optimize-previews.yml"
      - "scripts/generate-previews.py"
  workflow_dispatch:

concurrency:
  group: image-preview-generation-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processor
        run: python -m pip install --upgrade Pillow
      - name: Generate WebP previews without changing originals
        run: python scripts/generate-previews.py
      - name: Rebase generated previews onto latest main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "All WebP previews already exist."
            exit 0
          fi
          git commit -m "Generate lightweight WebP image previews"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
