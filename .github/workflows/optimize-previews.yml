name: Generate lightweight image previews

on:
  push:
    branches: [main]
    paths:
      - "assets/**/*.png"
      - "assets/**/*.jpg"
      - "assets/**/*.jpeg"
      - ".github/workflows/optimize-previews.yml"
      - "scripts/generate-previews.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processor
        run: python -m pip install --upgrade Pillow
      - name: Generate WebP previews without changing originals
        run: python scripts/generate-previews.py
      - name: Commit generated previews
        run: |
          if [[ -n "$(git status --porcelain -- 'assets/**/*.webp' 'assets/*.webp')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Generate lightweight WebP image previews"
            git push
          else
            echo "All WebP previews already exist."
          fi
